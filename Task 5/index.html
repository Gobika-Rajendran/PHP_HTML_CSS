<!DOCTYPE html>
<html>
<head>
    <title>Student Result Processing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Student Result Processing System</h1>

<form action="result.php" method="POST">

<label>Student Name</label>
<input type="text" name="name" required>

<label>Register Number</label>
<input type="text" name="regno" required>

<label>Tamil Marks</label>
<input type="number" name="tamil" min="0" max="100" required>

<label>English Marks</label>
<input type="number" name="english" min="0" max="100" required>

<label>Mathematics Marks</label>
<input type="number" name="maths" min="0" max="100" required>

<label>Science Marks</label>
<input type="number" name="science" min="0" max="100" required>

<label>Social Science Marks</label>
<input type="number" name="social" min="0" max="100" required>

<br><br>

<input type="submit" value="Calculate Result">
<input type="reset" value="Clear">

</form>

</div>

</body>
</html>
