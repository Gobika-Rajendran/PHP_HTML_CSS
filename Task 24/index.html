<!DOCTYPE html>
<html>
<head>
    <title>Employee Information Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Employee Information Portal</h1>

<form action="result.php" method="POST">

<label>Employee ID</label>
<input type="text" name="empid" required>

<label>Employee Name</label>
<input type="text" name="name" required>

<label>Age</label>
<input type="number" name="age" min="18" max="60" required>

<label>Gender</label>

<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Department</label>
<input type="text" name="department" required>

<label>Designation</label>
<input type="text" name="designation" required>

<label>Email ID</label>
<input type="email" name="email" required>

<label>Mobile Number</label>
<input type="text" name="mobile" maxlength="10" required>

<label>Salary ($)</label>
<input type="number" name="salary" min="0" required>

<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Clear">

</form>

</div>

</body>
</html>
