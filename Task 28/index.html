<!DOCTYPE html>
<html>
<head>
    <title>Parent-Teacher Meeting Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Parent-Teacher Meeting Registration</h1>

<form action="result.php" method="POST">

<label>Parent Name</label>
<input type="text" name="parentname" required>

<label>Student Name</label>
<input type="text" name="studentname" required>

<label>Class</label>
<input type="text" name="class" required>

<label>Teacher Name</label>
<input type="text" name="teachername" required>

<label>Meeting Date</label>
<input type="date" name="meetingdate" required>

<label>Select Meeting Slot</label>

<select name="slot" required>
<option value="">Select Slot</option>
<option>09:00 AM - 09:30 AM</option>
<option>09:30 AM - 10:00 AM</option>
<option>10:00 AM - 10:30 AM</option>
<option>10:30 AM - 11:00 AM</option>
<option>11:00 AM - 11:30 AM</option>
<option>11:30 AM - 12:00 PM</option>
</select>

<label>Mobile Number</label>
<input type="text" name="mobile" maxlength="10" required>

<br><br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>

</div>

</body>
</html>
